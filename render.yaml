# Render Blueprint — deploys server + client
# Docs: https://docs.render.com/blueprint-spec

services:
  # ── Backend API (Web Service) ──────────────────────────
  - type: web
    name: offerflow-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false          # Render will prompt you to fill this in
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false          # Set to the static site URL after first deploy
      - key: NEW_RELIC_ENABLED
        value: "false"
      - key: NEW_RELIC_APP_NAME
        value: OfferFlow-API
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_LOG_LEVEL
        value: info
      - key: NEW_RELIC_LOG
        value: stdout
      - key: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
        value: "true"
      - key: NEW_RELIC_TRANSACTION_TRACER_ENABLED
        value: "true"
      - key: NEW_RELIC_ERROR_COLLECTOR_ENABLED
        value: "true"
      - key: NEW_RELIC_ERROR_COLLECTOR_IGNORE_STATUS_CODES
        value: 401,404
      - key: NEW_RELIC_ATTRIBUTES_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
        value: "true"
      - key: NEW_RELIC_AI_MONITORING_ENABLED
        value: "false"
      - key: NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED
        value: "false"

  # ── Frontend (Static Site) ─────────────────────────────
  - type: web
    name: offerflow-client
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to https://offerflow-server.onrender.com/api/v1
      - key: VITE_WS_URL
        sync: false          # Set to wss://offerflow-server.onrender.com/api/v1/interviews/ws
      - key: VITE_NEW_RELIC_ENABLED
        value: "false"
      - key: VITE_NEW_RELIC_ACCOUNT_ID
        sync: false
      - key: VITE_NEW_RELIC_TRUST_KEY
        sync: false
      - key: VITE_NEW_RELIC_AGENT_ID
        sync: false
      - key: VITE_NEW_RELIC_LICENSE_KEY
        sync: false
      - key: VITE_NEW_RELIC_APPLICATION_ID
        sync: false
      - key: VITE_NEW_RELIC_BEACON
        value: bam.nr-data.net
      - key: VITE_NEW_RELIC_ERROR_BEACON
        value: bam.nr-data.net
      - key: VITE_NEW_RELIC_DISTRIBUTED_TRACING_ORIGINS
        sync: false
