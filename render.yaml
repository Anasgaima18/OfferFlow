# Render Blueprint — deploys server + client + Redis
# Docs: https://docs.render.com/blueprint-spec
#
# F5: The server is now on `starter` (512 MB / 0.5 vCPU, no idle sleep).
# `free` causes WebSocket interviews to die mid-session because Render spins
# the instance down after 15 min of idle and there's no horizontal-scale
# path while the rate limiter and WS server hold state in process memory.
#
# Redis is provisioned because:
#   - F7 — rate limiter must share counters across instances
#   - F17 — feedback queue (when promoted to BullMQ)
#   - circuit-breaker / breaker-coordination across instances
#
# Promote `plan: starter` → `standard` once you have >50 concurrent interviews;
# the WSS opens up to 3 outbound WS per session (Sarvam STT + ElevenLabs TTS
# + the inbound client) so RAM scales linearly with concurrency.

services:
  # ── Backend API (Web Service) ──────────────────────────
  - type: web
    name: offerflow-server
    runtime: node
    region: oregon
    plan: starter            # F5: was `free` — WebSocket sessions died on cold start
    numInstances: 1          # Bump to 2-3 once REDIS_URL is wired (rate-limiter is now Redis-aware)
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # F3: enables RLS-scoped per-user clients. Get from Supabase
      # Project Settings → API → JWT Secret.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      # F7 + F17: shared Redis for rate-limit + future job queues.
      - key: REDIS_URL
        fromService:
          type: redis
          name: offerflow-redis
          property: connectionString
      # F12: optional self-hosted Piston (recommended for prod).
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston
      # F14: WS connection caps. Tune up after monitoring.
      - key: WS_PER_IP_LIMIT
        value: "10"
      - key: WS_GLOBAL_LIMIT
        value: "200"
      # Phase 5: protect /metrics from public scraping.
      - key: METRICS_TOKEN
        sync: false
      - key: NEW_RELIC_ENABLED
        value: "false"
      - key: NEW_RELIC_APP_NAME
        value: OfferFlow-API
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_LOG_LEVEL
        value: info
      - key: NEW_RELIC_LOG
        value: stdout
      - key: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
        value: "true"
      - key: NEW_RELIC_TRANSACTION_TRACER_ENABLED
        value: "true"
      - key: NEW_RELIC_ERROR_COLLECTOR_ENABLED
        value: "true"
      - key: NEW_RELIC_ERROR_COLLECTOR_IGNORE_STATUS_CODES
        value: 401,404
      - key: NEW_RELIC_ATTRIBUTES_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
        value: "true"
      - key: NEW_RELIC_AI_MONITORING_ENABLED
        value: "false"
      - key: NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED
        value: "false"

  # ── Frontend (Static Site) ─────────────────────────────
  - type: web
    name: offerflow-client
    runtime: static
    region: oregon
    plan: free                 # Static sites don't sleep — free is fine
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_NEW_RELIC_ENABLED
        value: "false"
      - key: VITE_NEW_RELIC_ACCOUNT_ID
        sync: false
      - key: VITE_NEW_RELIC_TRUST_KEY
        sync: false
      - key: VITE_NEW_RELIC_AGENT_ID
        sync: false
      - key: VITE_NEW_RELIC_LICENSE_KEY
        sync: false
      - key: VITE_NEW_RELIC_APPLICATION_ID
        sync: false
      - key: VITE_NEW_RELIC_BEACON
        value: bam.nr-data.net
      - key: VITE_NEW_RELIC_ERROR_BEACON
        value: bam.nr-data.net
      - key: VITE_NEW_RELIC_DISTRIBUTED_TRACING_ORIGINS
        sync: false

  # ── Redis (rate limit + breakers + future queues) ─────
  - type: redis
    name: offerflow-redis
    region: oregon
    plan: free                 # Render's free Redis is 25 MB, fine for rate-limit
    ipAllowList: []            # Internal-only; reach from offerflow-server
