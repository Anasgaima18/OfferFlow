version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - NODE_ENV=production
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-OfferFlow-API}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_LOG_LEVEL=${NEW_RELIC_LOG_LEVEL:-info}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-stdout}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
      - NEW_RELIC_TRANSACTION_TRACER_ENABLED=${NEW_RELIC_TRANSACTION_TRACER_ENABLED:-true}
      - NEW_RELIC_ERROR_COLLECTOR_ENABLED=${NEW_RELIC_ERROR_COLLECTOR_ENABLED:-true}
      - NEW_RELIC_ERROR_COLLECTOR_IGNORE_STATUS_CODES=${NEW_RELIC_ERROR_COLLECTOR_IGNORE_STATUS_CODES:-401,404}
      - NEW_RELIC_ATTRIBUTES_ENABLED=${NEW_RELIC_ATTRIBUTES_ENABLED:-true}
      - NEW_RELIC_APPLICATION_LOGGING_ENABLED=${NEW_RELIC_APPLICATION_LOGGING_ENABLED:-true}
      - NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED=${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED:-true}
      - NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED=${NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED:-true}
      - NEW_RELIC_AI_MONITORING_ENABLED=${NEW_RELIC_AI_MONITORING_ENABLED:-false}
      - NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED=${NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api/v1}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:5000/api/v1/interviews/ws}
        - VITE_NEW_RELIC_ENABLED=${VITE_NEW_RELIC_ENABLED:-false}
        - VITE_NEW_RELIC_ACCOUNT_ID=${VITE_NEW_RELIC_ACCOUNT_ID}
        - VITE_NEW_RELIC_TRUST_KEY=${VITE_NEW_RELIC_TRUST_KEY}
        - VITE_NEW_RELIC_AGENT_ID=${VITE_NEW_RELIC_AGENT_ID}
        - VITE_NEW_RELIC_LICENSE_KEY=${VITE_NEW_RELIC_LICENSE_KEY}
        - VITE_NEW_RELIC_APPLICATION_ID=${VITE_NEW_RELIC_APPLICATION_ID}
        - VITE_NEW_RELIC_BEACON=${VITE_NEW_RELIC_BEACON:-bam.nr-data.net}
        - VITE_NEW_RELIC_ERROR_BEACON=${VITE_NEW_RELIC_ERROR_BEACON:-bam.nr-data.net}
        - VITE_NEW_RELIC_DISTRIBUTED_TRACING_ORIGINS=${VITE_NEW_RELIC_DISTRIBUTED_TRACING_ORIGINS:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
